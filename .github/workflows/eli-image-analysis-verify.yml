name: Eli image analysis verification

on:
  push:
    branches:
      - feature/eli-image-analysis-20261029
  workflow_dispatch:

jobs:
  bot-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    env:
      OPENAI_API_KEY: ""
      TELEGRAM_BOT_TOKEN: "test-token"
      HEYGEN_API_KEY: ""
      STRIPE_SECRET_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run full offline bot suite
        run: npm run test:offline
