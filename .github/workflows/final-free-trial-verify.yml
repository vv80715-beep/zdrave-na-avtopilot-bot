name: Final Free Trial cost-control verification

on:
  push:
    branches:
      - final/free-trial-cost-control-20261029
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    env:
      OPENAI_API_KEY: ""
      HEYGEN_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      GEMINI_API_KEY: ""
      TELEGRAM_BOT_TOKEN: "offline-test-token"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm test
