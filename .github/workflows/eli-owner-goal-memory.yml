name: Eli owner goal memory regression

on:
  push:
    branches:
      - fix/eli-v22-owner-memory-github-20261008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-memory-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: Install dependencies without provider credentials
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check modified modules
        run: |
          node --check index.js
          node --check brain/ownerGoalMemory.js
          node --check dailyLogService.js
          node --check commands/showmemory.js
      - name: Test explicit owner memory without real user data or Telegram token
        run: node --test test/eliOwnerGoalMemory.test.js
        env:
          TELEGRAM_BOT_TOKEN: ''
          OPENAI_API_KEY: ''
          HEYGEN_API_KEY: ''
          STRIPE_SECRET_KEY: ''
