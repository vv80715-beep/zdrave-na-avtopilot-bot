openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mini-app
    description: Disabled-by-default owner-only staging demo routes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mini-app/session:
    post:
      operationId: createMiniAppSession
      tags: [mini-app]
      summary: Validate Telegram initData and create a short-lived per-user session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniAppSessionInput"
      responses:
        "200":
          description: Session cookie issued for the Telegram user in signed initData
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppSession"
        "400":
          description: Invalid request
        "401":
          description: Invalid or stale Telegram initData
        "403":
          description: Request is not from the configured origin
  /mini-app/demo-chat:
    post:
      operationId: postMiniAppDemoChat
      tags: [mini-app]
      summary: Return a fixed text-only staging demo response
      security:
        - MiniAppSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniAppDemoChatInput"
      responses:
        "200":
          description: Static demo reply; no provider or persistence is used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppDemoChatResponse"
        "401":
          description: Valid owner session required
        "403":
          description: Request is not from the configured origin
  /mini-app/profile:
    post:
      operationId: readMiniAppProfileSnapshot
      tags: [mini-app]
      summary: Read the authenticated Telegram user's existing bot profile and progress stores
      description: Read-only. The Telegram ID comes only from the signed server session. The API forwards a signed internal claim to the existing bot process, which owns legacy JSON access. Owner dossier is included only for the verified owner.
      security:
        - MiniAppSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniAppProfileRequest"
      responses:
        "200":
          description: Authenticated user's existing read-only bot data and entitlement status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppProfileResponse"
        "400":
          description: Invalid request or client-supplied identity
        "401":
          description: Valid Telegram session required
        "403":
          description: Request is not from the configured origin
        "503":
          description: Internal bot bridge, legacy store, or entitlement service unavailable
  /mini-app/media/image:
    post:
      operationId: postMiniAppOwnerImage
      tags: [mini-app]
      summary: Analyze one image in the explicitly enabled owner-only development staging route
      description: Disabled by default. Requires the existing owner session and exact configured origin. Uses OpenAI only when the separate media AI flag is explicitly enabled.
      security:
        - MiniAppSessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MiniAppImageUpload"
      responses:
        "200":
          description: Staging-only image analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppImageResult"
        "400":
          description: Invalid multipart fields
        "401":
          description: Valid owner session required
        "403":
          description: Request is not from the configured origin
        "404":
          description: Media AI feature is disabled
        "413":
          description: Image exceeds the upload limit
        "415":
          description: Unsupported or invalid image type
        "429":
          description: Staging rate or concurrency limit reached
        "502":
          description: Media processing failed
        "503":
          description: OpenAI is not configured
  /mini-app/media/voice:
    post:
      operationId: postMiniAppOwnerVoice
      tags: [mini-app]
      summary: Transcribe one voice recording and return a text-only staging response
      description: Disabled by default. Requires the existing owner session and exact configured origin. No TTS or avatar output is used.
      security:
        - MiniAppSessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MiniAppVoiceUpload"
      responses:
        "200":
          description: Staging-only transcript and text reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppVoiceResult"
        "400":
          description: Invalid multipart fields
        "401":
          description: Valid owner session required
        "403":
          description: Request is not from the configured origin
        "404":
          description: Media AI feature is disabled
        "413":
          description: Audio exceeds the upload or duration limit
        "415":
          description: Unsupported or invalid audio type
        "429":
          description: Staging rate or concurrency limit reached
        "502":
          description: Media processing failed
        "503":
          description: OpenAI is not configured
components:
  securitySchemes:
    MiniAppSessionCookie:
      type: apiKey
      in: cookie
      name: eli_mini_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MiniAppSessionInput:
      type: object
      properties:
        initData:
          type: string
          minLength: 1
          maxLength: 16384
      required: [initData]
      additionalProperties: false
    MiniAppSession:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        expiresAt:
          type: string
          format: date-time
      required: [ok, expiresAt]
    MiniAppDemoChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1200
        language:
          type: string
          enum: [bg, en]
      required: [message]
      additionalProperties: false
    MiniAppProfileRequest:
      type: object
      additionalProperties: false
    MiniAppProfileResponse:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          const: read_only
        snapshot:
          type: object
          additionalProperties: true
      required: [mode, snapshot]
    MiniAppDemoChatResponse:
      type: object
      properties:
        reply:
          type: string
        demo:
          type: boolean
          const: true
      required: [reply, demo]
    MiniAppImageUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: One JPEG, PNG, or WebP image up to 8 MiB
        language:
          type: string
          enum: [bg, en]
        caption:
          type: string
          maxLength: 1200
      required: [file]
    MiniAppVoiceUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: One supported audio recording up to 15 MiB and 90 seconds
        language:
          type: string
          enum: [bg, en]
      required: [file]
    MiniAppImageResult:
      type: object
      properties:
        reply:
          type: string
        mediaType:
          type: string
          const: image
        staged:
          type: boolean
          const: true
      required: [reply, mediaType, staged]
    MiniAppVoiceResult:
      type: object
      properties:
        transcript:
          type: string
        reply:
          type: string
        mediaType:
          type: string
          const: voice
        staged:
          type: boolean
          const: true
      required: [transcript, reply, mediaType, staged]

